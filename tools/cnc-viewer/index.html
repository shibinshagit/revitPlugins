<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UNIQUBE CNC Viewer</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 12px "Segoe UI", Tahoma, sans-serif;
    color: #1b1b1b;
    background: #eef1f5;
    display: flex;
    flex-direction: column;
  }

  header {
    background: linear-gradient(#1f7bc4, #1667a8);
    color: #fff;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 0 0 auto;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  header .files { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  header select, header button, header input[type=number] {
    font: inherit; padding: 3px 6px; border-radius: 3px;
    border: 1px solid #0e4b7d; background: #fff; color: #1b1b1b;
  }
  header button { cursor: pointer; background: #f3f6f9; }
  header button:hover { background: #fff; }
  header label { color: #dbeaf7; }

  #summary {
    flex: 0 0 auto;
    padding: 5px 10px;
    background: #fbfcfd;
    border-bottom: 1px solid #c9d2dc;
    font-weight: 600;
  }
  #summary .muted { font-weight: 400; color: #5b6875; }

  main { flex: 1 1 auto; display: flex; min-height: 0; }

  #left {
    flex: 0 0 380px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #c9d2dc;
    background: #fbfcfd;
    min-height: 0;
  }
  .tabs { display: flex; flex: 0 0 auto; border-bottom: 1px solid #c9d2dc; }
  .tabs button {
    flex: 1 1 0; padding: 6px 4px; font: inherit; cursor: pointer;
    background: #e7ecf1; border: 0; border-right: 1px solid #c9d2dc;
  }
  .tabs button.on { background: #fff; font-weight: 600; box-shadow: inset 0 -2px 0 #1f7bc4; }
  .pane { flex: 1 1 auto; overflow: auto; display: none; }
  .pane.on { display: block; }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 3px 6px; text-align: left; white-space: nowrap; }
  thead th {
    position: sticky; top: 0; background: #e7ecf1;
    border-bottom: 1px solid #c9d2dc; font-weight: 600;
  }
  tbody tr { border-bottom: 1px solid #eceff2; cursor: pointer; }
  tbody tr:hover { background: #eef6fd; }
  tbody tr.sel { background: #ffe9e6; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .chip {
    display: inline-block; padding: 0 5px; border-radius: 8px;
    background: #e7ecf1; color: #3a4855; font-size: 11px;
  }

  #right { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  #viewbar {
    flex: 0 0 auto; padding: 4px 8px; background: #fbfcfd;
    border-bottom: 1px solid #c9d2dc; display: flex; gap: 10px; align-items: center;
  }
  #viewbar button { font: inherit; padding: 2px 8px; cursor: pointer; }
  #legend { display: flex; gap: 10px; margin-left: auto; color: #3a4855; }
  #legend span { display: flex; align-items: center; gap: 4px; }
  #legend i { width: 11px; height: 11px; display: inline-block; border-radius: 2px; }

  #plotwrap { flex: 1 1 auto; position: relative; min-height: 0; background: #fff; }
  /* canvas is a replaced element: inset alone will not stretch it */
  #plot {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%;
    display: block; cursor: crosshair;
  }
  #hint {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 10px;
    color: #6b7885; text-align: center; pointer-events: none; padding: 20px;
  }
  #hint strong { font-size: 15px; color: #3a4855; }
  #readout {
    position: absolute; right: 8px; bottom: 6px; background: rgba(255,255,255,.9);
    border: 1px solid #c9d2dc; border-radius: 3px; padding: 2px 6px;
    font-variant-numeric: tabular-nums; color: #3a4855;
  }
  body.drag #plotwrap { outline: 3px dashed #1f7bc4; outline-offset: -6px; }

  #issues { flex: 0 0 auto; max-height: 148px; overflow: auto; border-top: 1px solid #c9d2dc; background: #fffdf7; }
  #issues div { padding: 3px 8px; border-bottom: 1px solid #f0ece1; }
  #issues .error { color: #a01818; background: #fdf0ef; }
  #issues .warn { color: #8a5a00; }
  #issues .info { color: #5b6875; }
  #issues .none { color: #2f7a34; }
</style>
</head>
<body>

<header>
  <h1>UNIQUBE CNC Viewer</h1>
  <div class="files">
    <button id="open">Open CNC file(s)</button>
    <input id="file" type="file" accept=".csv,text/csv" multiple hidden>
    <select id="filesel" title="Loaded files"></select>
    <label>waste/part <input id="waste" type="number" value="11" step="0.01" min="0" style="width:64px"></label>
  </div>
</header>

<div id="summary"><span class="muted">No file loaded.</span></div>

<main>
  <div id="left">
    <div class="tabs">
      <button data-pane="list" class="on">Workpiece list</button>
      <button data-pane="actions">Action list</button>
      <button data-pane="part">Current workpiece</button>
    </div>
    <div id="pane-list" class="pane on"></div>
    <div id="pane-actions" class="pane"></div>
    <div id="pane-part" class="pane"></div>
  </div>

  <div id="right">
    <div id="viewbar">
      <button id="fit">Fit</button>
      <button id="zin">+</button>
      <button id="zout">&minus;</button>
      <label><input id="showops" type="checkbox" checked> operations</label>
      <label><input id="showlabels" type="checkbox" checked> labels</label>
      <label><input id="showstations" type="checkbox"> stations</label>
      <div id="legend"></div>
    </div>
    <div id="plotwrap">
      <canvas id="plot"></canvas>
      <div id="hint">
        <strong>Drop a CNC .csv here</strong>
        <div>The panel is drawn exactly as the file describes it, with every<br>
        dimple, swage, lip notch and web notch at its station.</div>
      </div>
      <div id="readout"></div>
    </div>
    <div id="issues"></div>
  </div>
</main>

<script src="cnc.js"></script>
<script src="viewer.js"></script>
</body>
</html>
